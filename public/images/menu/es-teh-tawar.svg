<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="lighttea" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <ellipse cx="300" cy="330" rx="140" ry="25" fill="#000000" opacity="0.08" />

  <!-- Tall Glass -->
  <g filter="url(#shadow)">
    <!-- Tea Liquid (Bening Segar) -->
    <path d="M 235 150 L 250 310 Q 300 325 350 310 L 365 150 Z" fill="url(#lighttea)" opacity="0.9" />
    <ellipse cx="300" cy="150" rx="65" ry="18" fill="#FBBF24" />

    <!-- Glass Rim & Walls -->
    <path d="M 225 120 L 245 320 Q 300 335 355 320 L 375 120 Z" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9" />
    <ellipse cx="300" cy="120" rx="75" ry="20" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9" />
  </g>

  <!-- Abundant Ice Cubes -->
  <g stroke="#FFFFFF" stroke-width="2" fill="#FFFFFF" fill-opacity="0.5">
    <rect x="260" y="145" width="36" height="36" rx="5" transform="rotate(12 260 145)" />
    <rect x="305" y="160" width="34" height="34" rx="4" transform="rotate(-18 305 160)" />
    <rect x="270" y="200" width="38" height="38" rx="6" transform="rotate(6 270 200)" />
    <rect x="310" y="230" width="35" height="35" rx="5" transform="rotate(-15 310 230)" />
  </g>

  <!-- Jasmine Flowers (Bunga Melati) -->
  <g transform="translate(300, 140)">
    <circle cx="0" cy="0" r="4" fill="#FEF08A" />
    <ellipse cx="0" cy="-8" rx="3" ry="5" fill="#FFFFFF" />
    <ellipse cx="8" cy="0" rx="5" ry="3" fill="#FFFFFF" />
    <ellipse cx="0" cy="8" rx="3" ry="5" fill="#FFFFFF" />
    <ellipse cx="-8" cy="0" rx="5" ry="3" fill="#FFFFFF" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(420, 30)">
    <rect width="150" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="495" y="18" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ES TEH TAWAR SEGAR</text>
  </g>
</svg>
