<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="soup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />
  <ellipse cx="300" cy="310" rx="220" ry="40" fill="#E2E8F0" opacity="0.6" />
  <ellipse cx="300" cy="275" rx="150" ry="30" fill="#000000" opacity="0.08" />

  <!-- Bowl -->
  <g filter="url(#shadow)">
    <path d="M 150 170 Q 150 270 300 270 Q 450 270 450 170 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
    <ellipse cx="300" cy="170" rx="150" ry="45" fill="#F8FAFC" />
    <!-- Rich Golden Broth -->
    <ellipse cx="300" cy="176" rx="140" ry="38" fill="url(#soup)" />
  </g>

  <!-- Abundant Bubuk Koya Gurih (Ambengan Special) -->
  <ellipse cx="300" cy="178" rx="80" ry="25" fill="#D97706" opacity="0.65" />
  <ellipse cx="295" cy="176" rx="60" ry="18" fill="#F59E0B" opacity="0.8" />
  <ellipse cx="290" cy="174" rx="40" ry="12" fill="#FEF08A" opacity="0.9" />

  <!-- Chicken Meat Pieces -->
  <g fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5">
    <rect x="200" y="165" width="38" height="13" rx="4" transform="rotate(-10 200 165)" />
    <rect x="360" y="170" width="36" height="12" rx="4" transform="rotate(20 360 170)" />
    <rect x="230" y="180" width="32" height="11" rx="3" transform="rotate(15 230 180)" />
  </g>

  <!-- Boiled Egg Half -->
  <g transform="translate(340, 150)">
    <ellipse cx="22" cy="18" rx="24" ry="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" transform="rotate(-15 22 18)" />
    <ellipse cx="20" cy="18" rx="13" ry="11" fill="#F59E0B" />
    <ellipse cx="18" cy="16" rx="9" ry="7" fill="#FDE047" />
  </g>

  <!-- Spring Onions & Fried Shallots -->
  <g fill="#15803D">
    <rect x="220" y="155" width="8" height="5" rx="1" transform="rotate(25 220 155)" />
    <rect x="250" y="160" width="7" height="4" rx="1" transform="rotate(-30 250 160)" />
    <rect x="330" y="185" width="8" height="5" rx="1" transform="rotate(45 330 185)" />
  </g>

  <!-- Steam -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65" fill="none">
    <path d="M 280 115 Q 265 90 280 65 Q 295 45 285 25" />
    <path d="M 320 115 Q 335 90 320 65 Q 310 45 325 25" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(400, 30)">
    <rect width="170" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="485" y="18" fill="#D97706" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SOTO SURABAYA KOYA</text>
  </g>
</svg>
