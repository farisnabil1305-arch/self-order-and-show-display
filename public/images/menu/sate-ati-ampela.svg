<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="ati" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="70%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>
    <radialGradient id="ampela" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="70%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#713F12" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#78350F" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Banana Leaf Plate -->
  <g filter="url(#shadow)">
    <path d="M 120 280 C 180 180, 420 180, 480 280 C 420 340, 180 340, 120 280 Z" fill="#15803D" stroke="#166534" stroke-width="4" />
    <path d="M 140 280 Q 300 240 460 280" fill="none" stroke="#22C55E" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Skewer -->
  <line x1="150" y1="300" x2="440" y2="155" stroke="#D97706" stroke-width="5" stroke-linecap="round" />

  <!-- Chunks of Chicken Liver & Gizzard (Ati & Ampela Ayam Halal) -->
  <g filter="url(#shadow)">
    <!-- Ati -->
    <path d="M 210 270 Q 235 240 250 260 Q 260 280 235 285 Z" fill="url(#ati)" stroke="#451A03" stroke-width="1.5" />
    <!-- Ampela -->
    <ellipse cx="280" cy="235" rx="24" ry="18" fill="url(#ampela)" stroke="#713F12" stroke-width="1.5" transform="rotate(-30 280 235)" />
    <!-- Ati -->
    <path d="M 310 220 Q 335 190 350 210 Q 360 230 335 235 Z" fill="url(#ati)" stroke="#451A03" stroke-width="1.5" />
    <!-- Ampela -->
    <ellipse cx="380" cy="185" rx="24" ry="18" fill="url(#ampela)" stroke="#713F12" stroke-width="1.5" transform="rotate(-30 380 185)" />
  </g>

  <!-- Turmeric spice specks -->
  <g fill="#FDE047" opacity="0.8">
    <circle cx="230" cy="265" r="2" />
    <circle cx="285" cy="230" r="2.5" />
    <circle cx="330" cy="215" r="2" />
    <circle cx="375" cy="180" r="2" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(410, 30)">
    <rect width="160" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="490" y="18" fill="#78350F" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SATE ATI AMPELA AYAM</text>
  </g>
</svg>
