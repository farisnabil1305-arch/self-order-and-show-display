<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="warmorange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="60%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#78350F" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <ellipse cx="300" cy="315" rx="180" ry="35" fill="#E2E8F0" opacity="0.6" />

  <!-- Saucer / Piring Cangkir -->
  <ellipse cx="300" cy="300" rx="160" ry="40" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" filter="url(#shadow)" />
  <ellipse cx="300" cy="298" rx="120" ry="28" fill="#F8FAFC" />

  <!-- Cup Body & Handle -->
  <g filter="url(#shadow)">
    <!-- Cup Handle -->
    <path d="M 370 190 C 430 190, 430 260, 360 260" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    <path d="M 370 190 C 430 190, 430 260, 360 260" fill="none" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />

    <!-- Cup Body -->
    <path d="M 210 180 L 235 285 Q 300 300 365 285 L 390 180 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />
    <ellipse cx="300" cy="180" rx="90" ry="30" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />

    <!-- Warm Citrus Liquid -->
    <ellipse cx="300" cy="184" rx="82" ry="25" fill="url(#warmorange)" />
  </g>

  <!-- Citrus Slice floating in warm cup -->
  <g transform="translate(300, 184)">
    <circle cx="0" cy="0" r="24" fill="#F97316" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Warm Steam -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" fill="none">
    <path d="M 275 130 Q 260 100 275 75 Q 290 50 280 25" />
    <path d="M 320 130 Q 335 100 320 75 Q 305 50 320 25" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(410, 30)">
    <rect width="160" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="490" y="18" fill="#EA580C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">JERUK HANGAT PERAS</text>
  </g>
</svg>
