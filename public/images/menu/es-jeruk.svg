<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="orangejuice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#EA580C" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <ellipse cx="300" cy="330" rx="140" ry="25" fill="#000000" opacity="0.08" />

  <!-- Straw -->
  <line x1="330" y1="70" x2="380" y2="20" stroke="#16A34A" stroke-width="8" stroke-linecap="round" />
  <line x1="330" y1="70" x2="280" y2="280" stroke="#16A34A" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Glass -->
  <g filter="url(#shadow)">
    <!-- Orange Juice Liquid -->
    <path d="M 235 150 L 250 310 Q 300 325 350 310 L 365 150 Z" fill="url(#orangejuice)" />
    <ellipse cx="300" cy="150" rx="65" ry="18" fill="#FDBA74" />

    <!-- Glass Rim & Walls -->
    <path d="M 225 120 L 245 320 Q 300 335 355 320 L 375 120 Z" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9" />
    <ellipse cx="300" cy="120" rx="75" ry="20" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9" />
  </g>

  <!-- Ice Cubes inside Glass -->
  <g stroke="#FFFFFF" stroke-width="2" fill="#FFFFFF" fill-opacity="0.4">
    <rect x="260" y="150" width="36" height="36" rx="5" transform="rotate(15 260 150)" />
    <rect x="310" y="165" width="34" height="34" rx="4" transform="rotate(-15 310 165)" />
    <rect x="270" y="210" width="36" height="36" rx="6" transform="rotate(8 270 210)" />
  </g>

  <!-- Sliced Orange Wheel on Rim -->
  <g transform="translate(225, 120)" filter="url(#shadow)">
    <!-- Orange Peel -->
    <circle cx="0" cy="0" r="38" fill="#F97316" stroke="#EA580C" stroke-width="3" />
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" />
    <!-- Orange Pulp segments -->
    <g fill="#FB923C">
      <path d="M 0 0 L -8 -26 A 28 28 0 0 1 8 -26 Z" />
      <path d="M 0 0 L 22 -14 A 28 28 0 0 1 26 5 Z" />
      <path d="M 0 0 L 22 14 A 28 28 0 0 1 8 26 Z" />
      <path d="M 0 0 L -8 26 A 28 28 0 0 1 -22 14 Z" />
      <path d="M 0 0 L -26 5 A 28 28 0 0 1 -22 -14 Z" />
    </g>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(410, 30)">
    <rect width="160" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="490" y="18" fill="#EA580C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ES JERUK PERAS MURNI</text>
  </g>
</svg>
