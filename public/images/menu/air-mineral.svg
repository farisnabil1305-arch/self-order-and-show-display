<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <ellipse cx="300" cy="330" rx="160" ry="25" fill="#000000" opacity="0.08" />

  <!-- Mineral Water Bottle (Left) -->
  <g transform="translate(190, 80)" filter="url(#shadow)">
    <!-- Blue Cap -->
    <rect x="42" y="0" width="26" height="18" rx="3" fill="#0284C7" stroke="#0369A1" stroke-width="1.5" />
    <!-- Neck -->
    <path d="M 44 18 L 40 45 L 70 45 L 66 18 Z" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="2" />
    <!-- Bottle Main Body -->
    <path d="M 20 80 Q 20 45 55 45 Q 90 45 90 80 L 95 240 Q 55 250 15 240 Z" fill="#F0F9FF" stroke="#38BDF8" stroke-width="3" />
    <!-- Blue Mountain Label -->
    <rect x="18" y="120" width="74" height="65" fill="#0284C7" />
    <path d="M 18 165 L 35 140 L 55 155 L 70 135 L 92 165 Z" fill="#FFFFFF" />
    <text x="55" y="178" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">AIR MINERAL</text>
  </g>

  <!-- Glass with Clear Ice Water (Right) -->
  <g transform="translate(320, 160)" filter="url(#shadow)">
    <!-- Water liquid -->
    <path d="M 10 30 L 20 160 Q 60 170 100 160 L 110 30 Z" fill="url(#water)" opacity="0.6" />
    <ellipse cx="60" cy="30" rx="50" ry="15" fill="#BAE6FD" />
    <!-- Glass outlines -->
    <path d="M 5 10 L 18 165 Q 60 175 102 165 L 115 10 Z" fill="none" stroke="#FFFFFF" stroke-width="4" />
    <ellipse cx="60" cy="10" rx="55" ry="16" fill="none" stroke="#FFFFFF" stroke-width="4" />
    <!-- Ice cubes in glass -->
    <rect x="35" y="30" width="25" height="25" rx="4" fill="#FFFFFF" opacity="0.7" transform="rotate(15 35 30)" />
    <rect x="65" y="45" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.7" transform="rotate(-15 65 45)" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(410, 30)">
    <rect width="160" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="490" y="18" fill="#0284C7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AIR MINERAL 600ML</text>
  </g>
</svg>
