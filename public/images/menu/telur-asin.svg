<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <radialGradient id="yolk" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Ceramic Plate -->
  <ellipse cx="300" cy="270" rx="190" ry="65" fill="#E2E8F0" opacity="0.6" />
  <g filter="url(#shadow)">
    <ellipse cx="300" cy="255" rx="170" ry="55" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />
  </g>

  <!-- Left Egg Half (Cut open showing oily orange yolk) -->
  <g transform="translate(230, 220)" filter="url(#shadow)">
    <!-- Cyan Shell Rim (Kulit Telur Bebek Abu Biru/Tosca) -->
    <ellipse cx="0" cy="0" rx="60" ry="48" fill="#6EE7B7" stroke="#059669" stroke-width="3" transform="rotate(-15)" />
    <!-- White Inner -->
    <ellipse cx="0" cy="0" rx="55" ry="43" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" transform="rotate(-15)" />
    <!-- Rich Masir Orange Yolk -->
    <ellipse cx="2" cy="0" rx="34" ry="28" fill="url(#yolk)" transform="rotate(-15)" />
    <!-- Oily Sheen Highlight -->
    <ellipse cx="-5" cy="-6" rx="12" ry="7" fill="#FDE047" opacity="0.7" transform="rotate(-15)" />
  </g>

  <!-- Right Egg Whole / Half Angle -->
  <g transform="translate(370, 225)" filter="url(#shadow)">
    <!-- Cyan Shell Outer -->
    <ellipse cx="0" cy="0" rx="58" ry="46" fill="#A7F3D0" stroke="#059669" stroke-width="3" transform="rotate(20)" />
    <ellipse cx="0" cy="0" rx="52" ry="41" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" transform="rotate(20)" />
    <ellipse cx="-2" cy="0" rx="32" ry="26" fill="url(#yolk)" transform="rotate(20)" />
    <ellipse cx="-8" cy="-6" rx="10" ry="6" fill="#FDE047" opacity="0.7" transform="rotate(20)" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(400, 30)">
    <rect width="170" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="485" y="18" fill="#EA580C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TELUR ASIN MASIR BREBES</text>
  </g>
</svg>
