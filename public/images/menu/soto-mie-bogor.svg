<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <radialGradient id="redsoup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="60%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7F1D1D" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />
  <ellipse cx="300" cy="310" rx="220" ry="40" fill="#E2E8F0" opacity="0.6" />
  <ellipse cx="300" cy="275" rx="150" ry="30" fill="#000000" opacity="0.08" />

  <!-- Bowl -->
  <g filter="url(#shadow)">
    <path d="M 150 170 Q 150 270 300 270 Q 450 270 450 170 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
    <ellipse cx="300" cy="170" rx="150" ry="45" fill="#F8FAFC" />
    <ellipse cx="300" cy="176" rx="140" ry="38" fill="url(#redsoup)" />
  </g>

  <!-- Yellow Egg Noodles (Mie Kuning) -->
  <path d="M 200 170 Q 230 185 260 170 Q 290 160 320 180 Q 350 170 380 180" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
  <path d="M 210 180 Q 240 195 270 175 Q 300 170 330 185" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />

  <!-- Crispy Spring Roll Slices (Risol Bihun Goreng) -->
  <g fill="#F59E0B" stroke="#B45309" stroke-width="2">
    <polygon points="320,150 355,160 345,175 310,165" />
    <polygon points="350,165 385,172 375,188 340,180" />
  </g>

  <!-- Daging Sengkel Sapi Halal -->
  <g fill="#451A03" stroke="#292524" stroke-width="1.5">
    <rect x="230" y="160" width="32" height="18" rx="4" transform="rotate(-15 230 160)" />
    <rect x="255" y="170" width="30" height="16" rx="4" transform="rotate(10 255 170)" />
  </g>

  <!-- Kol Segar & Tomat Merah -->
  <g fill="#86EFAC">
    <rect x="200" y="160" width="16" height="8" rx="2" transform="rotate(45 200 160)" />
    <rect x="280" y="180" width="14" height="7" rx="2" transform="rotate(-20 280 180)" />
  </g>
  <path d="M 280 155 A 14 14 0 0 1 305 168 Z" fill="#DC2626" />

  <!-- Steam -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65" fill="none">
    <path d="M 280 115 Q 265 90 280 65 Q 295 45 285 25" />
    <path d="M 320 115 Q 335 90 320 65 Q 310 45 325 25" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(420, 30)">
    <rect width="150" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="495" y="18" fill="#B91C1C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SOTO MIE RISOL</text>
  </g>
</svg>
