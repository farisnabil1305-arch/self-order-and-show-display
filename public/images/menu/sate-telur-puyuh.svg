<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="egg" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="60%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#78350F" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Banana Leaf / Plate -->
  <g filter="url(#shadow)">
    <path d="M 120 280 C 180 180, 420 180, 480 280 C 420 340, 180 340, 120 280 Z" fill="#15803D" stroke="#166534" stroke-width="4" />
    <!-- Leaf ribs -->
    <path d="M 140 280 Q 300 240 460 280" fill="none" stroke="#22C55E" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Skewer 1 (Bamboo Skewer) -->
  <line x1="160" y1="290" x2="430" y2="160" stroke="#D97706" stroke-width="5" stroke-linecap="round" />

  <!-- 4 Quail Eggs on Skewer 1 (Telur Puyuh Bacem) -->
  <g filter="url(#shadow)">
    <ellipse cx="230" cy="255" rx="25" ry="20" fill="url(#egg)" transform="rotate(-25 230 255)" />
    <ellipse cx="280" cy="230" rx="25" ry="20" fill="url(#egg)" transform="rotate(-25 280 230)" />
    <ellipse cx="330" cy="205" rx="25" ry="20" fill="url(#egg)" transform="rotate(-25 330 205)" />
    <ellipse cx="380" cy="180" rx="25" ry="20" fill="url(#egg)" transform="rotate(-25 380 180)" />

    <!-- Glossy Sweet Soy Highlight on Eggs -->
    <ellipse cx="225" cy="250" rx="10" ry="4" fill="#FDE68A" opacity="0.5" transform="rotate(-25 225 250)" />
    <ellipse cx="275" cy="225" rx="10" ry="4" fill="#FDE68A" opacity="0.5" transform="rotate(-25 275 225)" />
    <ellipse cx="325" cy="200" rx="10" ry="4" fill="#FDE68A" opacity="0.5" transform="rotate(-25 325 200)" />
    <ellipse cx="375" cy="175" rx="10" ry="4" fill="#FDE68A" opacity="0.5" transform="rotate(-25 375 175)" />
  </g>

  <!-- Skewer 2 in background -->
  <line x1="180" y1="320" x2="450" y2="190" stroke="#B45309" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <ellipse cx="250" cy="285" rx="22" ry="17" fill="url(#egg)" opacity="0.8" transform="rotate(-25 250 285)" />
  <ellipse cx="300" cy="260" rx="22" ry="17" fill="url(#egg)" opacity="0.8" transform="rotate(-25 300 260)" />
  <ellipse cx="350" cy="235" rx="22" ry="17" fill="url(#egg)" opacity="0.8" transform="rotate(-25 350 235)" />
  <ellipse cx="400" cy="210" rx="22" ry="17" fill="url(#egg)" opacity="0.8" transform="rotate(-25 400 210)" />

  <!-- Fried Shallots on Leaf -->
  <g fill="#B45309">
    <ellipse cx="200" cy="240" rx="5" ry="3" transform="rotate(30 200 240)" />
    <ellipse cx="410" cy="240" rx="6" ry="3" transform="rotate(-20 410 240)" />
  </g>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(400, 30)">
    <rect width="170" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="485" y="18" fill="#78350F" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SATE TELUR PUYUH</text>
  </g>
</svg>
