<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="soup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Subtle Mat / Table surface -->
  <ellipse cx="300" cy="310" rx="220" ry="40" fill="#E2E8F0" opacity="0.6" />

  <!-- Soup Bowl Shadow -->
  <ellipse cx="300" cy="275" rx="150" ry="30" fill="#000000" opacity="0.08" />

  <!-- Ceramic Bowl Outer -->
  <g filter="url(#shadow)">
    <!-- Bowl Body -->
    <path d="M 150 170 Q 150 270 300 270 Q 450 270 450 170 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
    <!-- Bowl Rim Back -->
    <ellipse cx="300" cy="170" rx="150" ry="45" fill="#F1F5F9" />
    <!-- Golden Soto Broth -->
    <ellipse cx="300" cy="176" rx="140" ry="38" fill="url(#soup)" />
  </g>

  <!-- Ingredients inside Soto Lamongan -->
  <!-- Bihun / White Noodles -->
  <path d="M 210 170 Q 240 185 270 175 Q 300 165 330 180 Q 360 170 390 180" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M 230 180 Q 260 195 290 180 Q 320 170 350 185" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

  <!-- Shredded Chicken (Ayam Suwir Kuning) -->
  <g fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5">
    <rect x="230" y="160" width="35" height="12" rx="4" transform="rotate(-15 230 160)" />
    <rect x="250" y="168" width="40" height="11" rx="4" transform="rotate(10 250 168)" />
    <rect x="220" y="175" width="30" height="10" rx="3" transform="rotate(5 220 175)" />
  </g>

  <!-- Boiled Egg Half (Telur Rebus) -->
  <g transform="translate(320, 155)">
    <!-- White -->
    <ellipse cx="25" cy="20" rx="26" ry="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" transform="rotate(-20 25 20)" />
    <!-- Yolk -->
    <ellipse cx="23" cy="20" rx="14" ry="12" fill="#F59E0B" />
    <ellipse cx="21" cy="18" rx="10" ry="8" fill="#FBBF24" />
  </g>

  <!-- Bubuk Koya Gurih (Sprinkles) -->
  <g fill="#D97706" opacity="0.8">
    <circle cx="280" cy="190" r="2" />
    <circle cx="285" cy="188" r="1.5" />
    <circle cx="292" cy="192" r="2" />
    <circle cx="275" cy="185" r="1.5" />
    <circle cx="300" cy="186" r="2" />
    <circle cx="310" cy="190" r="1.5" />
  </g>

  <!-- Daun Bawang / Seledri (Spring Onions) -->
  <g fill="#16A34A">
    <rect x="210" y="155" width="8" height="5" rx="1" transform="rotate(30 210 155)" />
    <rect x="270" y="160" width="9" height="5" rx="1" transform="rotate(-40 270 160)" />
    <rect x="360" y="170" width="8" height="5" rx="1" transform="rotate(20 360 170)" />
    <rect x="290" y="175" width="7" height="4" rx="1" transform="rotate(60 290 175)" />
  </g>

  <!-- Lime / Jeruk Nipis Slice -->
  <g transform="translate(190, 140)">
    <path d="M 0 25 A 25 25 0 0 1 45 10 Z" fill="#65A30D" />
    <path d="M 4 23 A 21 21 0 0 1 41 12 Z" fill="#BEF264" />
  </g>

  <!-- Steam / Aroma Kehangatan -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65" fill="none">
    <path d="M 270 120 Q 260 95 275 75 Q 290 55 280 35" />
    <path d="M 305 115 Q 320 90 305 70 Q 295 50 310 30" />
    <path d="M 340 125 Q 330 100 345 80 Q 360 60 350 40" />
  </g>

  <!-- Halal & Dish Label Badge -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>

  <g transform="translate(420, 30)">
    <rect width="150" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="495" y="18" fill="#D97706" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SOTO AYAM KOYA</text>
  </g>
</svg>
