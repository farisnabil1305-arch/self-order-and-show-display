<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <radialGradient id="usus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="60%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#78350F" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Banana Leaf Plate -->
  <g filter="url(#shadow)">
    <path d="M 120 280 C 180 180, 420 180, 480 280 C 420 340, 180 340, 120 280 Z" fill="#15803D" stroke="#166534" stroke-width="4" />
    <path d="M 140 280 Q 300 240 460 280" fill="none" stroke="#22C55E" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Skewer 1 Bamboo Stick -->
  <line x1="140" y1="310" x2="450" y2="150" stroke="#D97706" stroke-width="5" stroke-linecap="round" />

  <!-- Woven Braided Chicken Intestines (Usus Ayam Bacem Halal) -->
  <g filter="url(#shadow)" stroke="#451A03" stroke-width="2">
    <!-- Spiraling Loops of usus -->
    <path d="M 200 280 C 190 260, 220 250, 230 265 C 240 280, 210 290, 200 280 Z" fill="url(#usus)" />
    <path d="M 230 265 C 220 245, 250 235, 260 250 C 270 265, 240 275, 230 265 Z" fill="url(#usus)" />
    <path d="M 260 250 C 250 230, 280 220, 290 235 C 300 250, 270 260, 260 250 Z" fill="url(#usus)" />
    <path d="M 290 235 C 280 215, 310 205, 320 220 C 330 235, 300 245, 290 235 Z" fill="url(#usus)" />
    <path d="M 320 220 C 310 200, 340 190, 350 205 C 360 220, 330 230, 320 220 Z" fill="url(#usus)" />
    <path d="M 350 205 C 340 185, 370 175, 380 190 C 390 205, 360 215, 350 205 Z" fill="url(#usus)" />
  </g>

  <!-- Sweet Soy Sauce Glossy Drizzle -->
  <path d="M 210 270 Q 280 240 370 195" fill="none" stroke="#FEF08A" stroke-width="3" opacity="0.6" stroke-linecap="round" />

  <!-- Second Skewer -->
  <line x1="170" y1="330" x2="470" y2="180" stroke="#B45309" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 250 290 C 240 270, 320 230, 370 210" fill="none" stroke="#78350F" stroke-width="16" stroke-linecap="round" opacity="0.8" />

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="14" fill="#059669" />
    <text x="55" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">100% HALAL</text>
  </g>
  <g transform="translate(390, 30)">
    <rect width="180" height="28" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="480" y="18" fill="#78350F" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SATE USUS AYAM BACEM</text>
  </g>
</svg>
